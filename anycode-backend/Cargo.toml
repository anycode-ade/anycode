[package]
name = "anycode"
version = "0.0.24"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
tokio = { version = "1", features = ["full"] }
socketioxide = { version = "0.18", features = ["state"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["ws"]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"]}
chrono = { version = "0.4", features = ["serde"] }
axum_static = "1.0"
toml = "0.8"
detect-lang = "0.1"
ropey = "1"
rayon = "1"
tokio-stream = "0.1"
tempfile = "3"
notify = "8"
portable-pty = "0.9"
anyhow = "1"
pathdiff = "0.2.3"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
dirs = "6"
lsp-types = "0.97"
url = "2.5"
similar = "2"
agent-client-protocol = { version = "1.2.0" }
agent-client-protocol-schema = { version = "1.4.0" }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
unicode-segmentation = "1"
git2 = "0.20"
base64 = "0.22"
