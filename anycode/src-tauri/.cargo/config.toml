[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-avx,-avx2,-bmi,-bmi2,-fma,-f16c",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-avx,-avx2,-bmi,-bmi2,-fma,-f16c",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-avx,-avx2,-bmi,-bmi2,-fma,-f16c",
]
