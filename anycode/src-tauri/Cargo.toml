[package]
name = "anycode-desktop"
version = "0.1.0"
description = "Anycode Desktop Application"
authors = ["Anycode Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "anycode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
anycode = { path = "../../anycode-backend" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-runtime-wry = "3.0.0-alpha.5"
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "6"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = "0.3.2"

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = true
