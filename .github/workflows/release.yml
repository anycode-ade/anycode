        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anycode-backend -> target
            anycode/src-tauri -> anycode/src-tauri/target

      - name: Build Desktop (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          else
            pnpm --filter anycode tauri build
          fi

      - name: Build Desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ("${{ matrix.target }}") {
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          } else {
            pnpm --filter anycode tauri build
          }

      - name: Package Desktop Artifacts (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-desktop
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-desktop/anycode-desktop-macos-${{ matrix.arch }}.dmg 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig dist-desktop/anycode-desktop-macos-${{ matrix.arch }}.dmg.sig 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz dist-desktop/ 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig dist-desktop/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp anycode/src-tauri/target/release/bundle/appimage/*.AppImage dist-desktop/anycode-desktop-linux-x86_64.AppImage 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-desktop/anycode-desktop-linux-x86_64.AppImage.sig 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/deb/*.deb dist-desktop/anycode-desktop-linux-amd64.deb 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/deb/*.deb.sig dist-desktop/anycode-desktop-linux-amd64.deb.sig 2>/dev/null || true
          fi
          ls -la dist-desktop

      - name: Package Desktop Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop | Out-Null
          $exe = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName dist-desktop/anycode-desktop-windows-x64-setup.exe
            $exeSig = "$($exe.FullName).sig"
            if (Test-Path $exeSig) { Copy-Item $exeSig dist-desktop/anycode-desktop-windows-x64-setup.exe.sig }
          }
          $msi = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName dist-desktop/anycode-desktop-windows-x64.msi
            $msiSig = "$($msi.FullName).sig"
            if (Test-Path $msiSig) { Copy-Item $msiSig dist-desktop/anycode-desktop-windows-x64.msi.sig }
          }
          $zip = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.zip -ErrorAction SilentlyContinue
          if ($zip) { Copy-Item $zip.FullName dist-desktop/ }
          $zipSig = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.zip.sig -ErrorAction SilentlyContinue
          if ($zipSig) { Copy-Item $zipSig.FullName dist-desktop/ }
          Get-ChildItem -Path dist-desktop

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*
