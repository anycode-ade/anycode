name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified: $(ls -la dist | head -5)"
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anycode-backend -> target
      
      - name: Build Linux x86_64 musl binary
        working-directory: ./anycode-backend
        run: cargo build --release --target x86_64-unknown-linux-musl
      
      - name: Package as tar.gz
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-release
          strip target/x86_64-unknown-linux-musl/release/anycode
          cp target/x86_64-unknown-linux-musl/release/anycode dist-release/
          tar -czf anycode-linux-x86_64-musl.tar.gz -C dist-release anycode
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: anycode-backend/anycode-linux-x86_64-musl.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md

  build-linux-arm64:
    name: Build for Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified: $(ls -la dist | head -5)"
      
      - name: Build Linux aarch64 musl binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: aarch64-unknown-linux-musl
          args: "--release --manifest-path anycode-backend/Cargo.toml"
          working-directory: .
      
      - name: Package as tar.gz
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-release
          cp target/aarch64-unknown-linux-musl/release/anycode dist-release/
          tar -czf anycode-linux-aarch64-musl.tar.gz -C dist-release anycode
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: anycode-backend/anycode-linux-aarch64-musl.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md

  build-macos:
    name: Build for macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified: $(ls -la dist | head -5)"
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anycode-backend -> target
      
      - name: Build macOS binaries
        working-directory: ./anycode-backend
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      
      - name: Create universal binary
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-release
          lipo -create \
            target/aarch64-apple-darwin/release/anycode \
            target/x86_64-apple-darwin/release/anycode \
            -output dist-release/anycode
      
      - name: Package as tar.gz
        working-directory: ./anycode-backend
        run: |
          strip dist-release/anycode
          tar -czf anycode-universal-apple-darwin.tar.gz -C dist-release anycode
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: anycode-backend/anycode-universal-apple-darwin.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Optimize Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: pwsh
        run: |
          "STORE_PATH=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build

      - name: Verify frontend build
        working-directory: ./anycode-backend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Error "Error: dist directory is missing"
          }
          $files = Get-ChildItem -Path dist -Recurse -File
          if ($files.Count -eq 0) {
            Write-Error "Error: dist directory is empty"
          }
          Write-Host "Frontend build verified. Total files: $($files.Count)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anycode-backend -> target

      - name: Build Windows binary
        working-directory: ./anycode-backend
        run: cargo build --release

      - name: Package as zip
        working-directory: ./anycode-backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target/release/anycode.exe dist-release/anycode.exe
          Compress-Archive -Path dist-release/anycode.exe -DestinationPath anycode-windows-x86_64.zip -Force

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: anycode-backend/anycode-windows-x86_64.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - platform: macOS Intel
            os: macos-latest
            arch: x64
            target: x86_64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            arch: x64
            target: ""
          - platform: Linux x64
            os: ubuntu-latest
            arch: x64
            target: ""
    steps:
      - uses: actions/checkout@v6

      - name: Optimize Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Get pnpm store directory (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "STORE_PATH=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            anycode-backend -> target
            anycode/src-tauri -> anycode/src-tauri/target

      - name: Build Desktop (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          else
            pnpm --filter anycode tauri build
          fi

      - name: Build Desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ("${{ matrix.target }}") {
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          } else {
            pnpm --filter anycode tauri build
          }

      - name: Package Desktop Artifacts (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-desktop
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-desktop/anycode-desktop-macos-${{ matrix.arch }}.dmg 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig dist-desktop/anycode-desktop-macos-${{ matrix.arch }}.dmg.sig 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz dist-desktop/ 2>/dev/null || true
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig dist-desktop/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp anycode/src-tauri/target/release/bundle/appimage/*.AppImage dist-desktop/anycode-desktop-linux-x86_64.AppImage 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-desktop/anycode-desktop-linux-x86_64.AppImage.sig 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/deb/*.deb dist-desktop/anycode-desktop-linux-amd64.deb 2>/dev/null || true
            cp anycode/src-tauri/target/release/bundle/deb/*.deb.sig dist-desktop/anycode-desktop-linux-amd64.deb.sig 2>/dev/null || true
          fi
          ls -la dist-desktop

      - name: Package Desktop Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop | Out-Null
          $exe = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName dist-desktop/anycode-desktop-windows-x64-setup.exe
            $exeSig = "$($exe.FullName).sig"
            if (Test-Path $exeSig) { Copy-Item $exeSig dist-desktop/anycode-desktop-windows-x64-setup.exe.sig }
          }
          $msi = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName dist-desktop/anycode-desktop-windows-x64.msi
            $msiSig = "$($msi.FullName).sig"
            if (Test-Path $msiSig) { Copy-Item $msiSig dist-desktop/anycode-desktop-windows-x64.msi.sig }
          }
          $zip = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.zip -ErrorAction SilentlyContinue
          if ($zip) { Copy-Item $zip.FullName dist-desktop/ }
          $zipSig = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.zip.sig -ErrorAction SilentlyContinue
          if ($zipSig) { Copy-Item $zipSig.FullName dist-desktop/ }
          Get-ChildItem -Path dist-desktop

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
