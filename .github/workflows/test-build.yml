name: Test Build

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-linux:
    name: Test Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified:"
          ls -la dist | head -10
          echo "Total files: $(find dist -type f | wc -l)"
      
      - name: Run core library tests
        working-directory: ./anycode-editor/core
        run: pnpm test -- --run
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          workspaces: |
            anycode-backend -> target
      
      - name: Run Rust backend tests
        working-directory: ./anycode-backend
        run: cargo test
      
      - name: Build Linux x86_64 musl binary (test)
        working-directory: ./anycode-backend
        env:
          RUSTFLAGS: "-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-bmi,-bmi2,-fma,-f16c"
          CFLAGS: "-march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-bmi -mno-bmi2 -mno-f16c"
          CXXFLAGS: "-march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-bmi -mno-bmi2 -mno-f16c"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify x86-64 baseline ISA (CLI)
        working-directory: ./anycode-backend
        run: |
          if objdump -d target/x86_64-unknown-linux-musl/release/anycode | grep -E -q '\b(vfmadd|vfnmadd|vfmsub|vfnmsub|vpbroadcast|vperm2i128|mulx|shrx|shlx|sarx|pdep|pext)'; then
            echo "Error: Non-baseline x86-64 (AVX2/FMA/BMI2) instructions detected in CLI binary!"
            objdump -d target/x86_64-unknown-linux-musl/release/anycode | grep -E '\b(vfmadd|vfnmadd|vfmsub|vfnmsub|vpbroadcast|vperm2i128|mulx|shrx|shlx|sarx|pdep|pext)' | head -20
            exit 1
          fi
          echo "Verified: CLI binary contains only baseline x86-64 instructions."
      
      - name: Check binary size
        working-directory: ./anycode-backend
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/anycode
          file target/x86_64-unknown-linux-musl/release/anycode
      
      - name: Test binary help
        working-directory: ./anycode-backend
        run: |
          ./target/x86_64-unknown-linux-musl/release/anycode --help

      - name: Package Linux x86_64 CLI
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-cli
          cp target/x86_64-unknown-linux-musl/release/anycode dist-cli/
          tar -czf anycode-linux-x86_64-musl.tar.gz -C dist-cli anycode

      - name: Upload Linux x86_64 CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: anycode-cli-linux-x86_64
          path: anycode-backend/anycode-linux-x86_64-musl.tar.gz

      - name: Set commit vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish Linux x86_64 to Commit Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          name: "Build ${{ steps.vars.outputs.sha_short }}"
          prerelease: true
          files: anycode-backend/anycode-linux-x86_64-musl.tar.gz

      - name: Publish Linux x86_64 to Nightly Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          files: anycode-backend/anycode-linux-x86_64-musl.tar.gz

  test-build-linux-arm64:
    name: Test Build Linux ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified: $(ls -la dist | head -5)"
      
      - name: Build Linux aarch64 musl binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: aarch64-unknown-linux-musl
          args: "--release --manifest-path anycode-backend/Cargo.toml"
          working-directory: .
      
      - name: Package as tar.gz
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-cli
          cp target/aarch64-unknown-linux-musl/release/anycode dist-cli/
          tar -czf anycode-linux-aarch64-musl.tar.gz -C dist-cli anycode

      - name: Upload Linux ARM64 CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: anycode-cli-linux-aarch64
          path: anycode-backend/anycode-linux-aarch64-musl.tar.gz

      - name: Set commit vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish Linux ARM64 to Commit Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          name: "Build ${{ steps.vars.outputs.sha_short }}"
          prerelease: true
          files: anycode-backend/anycode-linux-aarch64-musl.tar.gz

      - name: Publish Linux ARM64 to Nightly Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          files: anycode-backend/anycode-linux-aarch64-musl.tar.gz

  test-build-macos:
    name: Test Build macOS CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build
      
      - name: Verify frontend build
        working-directory: ./anycode-backend
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist directory is empty or missing"
            exit 1
          fi
          echo "Frontend build verified: $(ls -la dist | head -5)"
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: |
            anycode-backend -> target
      
      - name: Build macOS binaries
        working-directory: ./anycode-backend
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      
      - name: Create universal binary and package
        working-directory: ./anycode-backend
        run: |
          mkdir -p dist-cli
          lipo -create \
            target/aarch64-apple-darwin/release/anycode \
            target/x86_64-apple-darwin/release/anycode \
            -output dist-cli/anycode
          ./dist-cli/anycode --help
          ./dist-cli/anycode --version
          tar -czf anycode-universal-apple-darwin.tar.gz -C dist-cli anycode

      - name: Upload macOS CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: anycode-cli-macos-universal
          path: anycode-backend/anycode-universal-apple-darwin.tar.gz

      - name: Set commit vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish macOS to Commit Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          name: "Build ${{ steps.vars.outputs.sha_short }}"
          prerelease: true
          files: anycode-backend/anycode-universal-apple-darwin.tar.gz

      - name: Publish macOS to Nightly Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          files: anycode-backend/anycode-universal-apple-darwin.tar.gz

  test-build-windows:
    name: Test Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Optimize Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:CARGO_HOME -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: pwsh
        run: |
          "STORE_PATH=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./anycode
        run: pnpm build

      - name: Verify frontend build
        working-directory: ./anycode-backend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Error "Error: dist directory is missing"
          }
          $files = Get-ChildItem -Path dist -Recurse -File
          if ($files.Count -eq 0) {
            Write-Error "Error: dist directory is empty"
          }
          Write-Host "Frontend build verified. Total files: $($files.Count)"

      - name: Run core library tests
        working-directory: ./anycode-editor/core
        run: pnpm test -- --run

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: |
            anycode-backend -> target

      - name: Run Rust backend tests
        working-directory: ./anycode-backend
        run: cargo test

      - name: Build Windows binary
        working-directory: ./anycode-backend
        run: cargo build --release

      - name: Check binary output
        working-directory: ./anycode-backend
        shell: pwsh
        run: |
          Get-Item target/release/anycode.exe | Format-List FullName,Length,LastWriteTime

      - name: Test binary help
        working-directory: ./anycode-backend
        run: .\target\release\anycode.exe --help

      - name: Package Windows x64 CLI
        working-directory: ./anycode-backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          Copy-Item target/release/anycode.exe dist-cli/anycode.exe
          Compress-Archive -Path dist-cli/anycode.exe -DestinationPath anycode-windows-x86_64.zip -Force

      - name: Upload Windows x64 CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: anycode-cli-windows-x86_64
          path: anycode-backend/anycode-windows-x86_64.zip

      - name: Set commit vars
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish Windows x64 to Commit Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ steps.vars.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          name: "Build ${{ steps.vars.outputs.sha_short }}"
          prerelease: true
          files: anycode-backend/anycode-windows-x86_64.zip

      - name: Publish Windows x64 to Nightly Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build"
          prerelease: true
          files: anycode-backend/anycode-windows-x86_64.zip

  test-desktop:
    name: Test Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - platform: Windows x64
            os: windows-latest
            arch: x64
            target: ""
          - platform: Linux x64
            os: ubuntu-24.04
            arch: x64
            target: ""
    steps:
      - uses: actions/checkout@v6

      - name: Optimize Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:CARGO_HOME -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Get pnpm store directory (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "STORE_PATH=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          workspaces: |
            anycode-backend -> target
            anycode/src-tauri -> target

      - name: Build Desktop (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export RUSTFLAGS="-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-bmi,-bmi2,-fma,-f16c"
            export CFLAGS="-march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-bmi -mno-bmi2 -mno-f16c"
            export CXXFLAGS="-march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-bmi -mno-bmi2 -mno-f16c"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          else
            pnpm --filter anycode tauri build
          fi

      - name: Verify x86-64 baseline ISA (Linux Desktop)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if objdump -d anycode/src-tauri/target/release/anycode-desktop | grep -E -q '\b(vfmadd|vfnmadd|vfmsub|vfnmsub|vpbroadcast|vperm2i128|mulx|shrx|shlx|sarx|pdep|pext)'; then
            echo "Error: Non-baseline x86-64 (AVX2/FMA/BMI2) instructions detected in Desktop binary!"
            objdump -d anycode/src-tauri/target/release/anycode-desktop | grep -E '\b(vfmadd|vfnmadd|vfmsub|vfnmsub|vpbroadcast|vperm2i128|mulx|shrx|shlx|sarx|pdep|pext)' | head -20
            exit 1
          fi
          echo "Verified: Desktop binary contains only baseline x86-64 instructions."

      - name: Build Desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.target }}") {
            pnpm --filter anycode tauri build --target ${{ matrix.target }}
          } else {
            pnpm --filter anycode tauri build
          }

      - name: Package Desktop Artifacts (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-desktop
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp anycode/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-desktop/anycode-desktop-macos-${{ matrix.arch }}.dmg
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp anycode/src-tauri/target/release/bundle/deb/*.deb dist-desktop/anycode-desktop-linux-amd64.deb
            strip anycode/src-tauri/target/release/anycode-desktop
            tar -czf dist-desktop/anycode-desktop-linux-x86_64.tar.gz -C anycode/src-tauri/target/release anycode-desktop
          fi
          ls -la dist-desktop

      - name: Package Desktop Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop | Out-Null
          $exe = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName dist-desktop/anycode-desktop-windows-x64-setup.exe }
          $msi = Get-ChildItem -Path anycode/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName dist-desktop/anycode-desktop-windows-x64.msi }
          Get-ChildItem -Path dist-desktop

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anycode-desktop-${{ matrix.arch }}-${{ runner.os }}
          path: dist-desktop/*
